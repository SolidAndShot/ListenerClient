plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = project.mod_id
}

version = project.mod_version
group = 'com.solidandshot'

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    }
    withSourcesJar()
}

loom {
    runs {
        client {
            client()
            setConfigName('Listener Client')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version.toInteger()
}

processResources {
    inputs.properties([
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_description: mod_description,
        mod_author: mod_author,
        minecraft_version: minecraft_version,
        fabric_loader_version: fabric_loader_version,
        fabric_short_version: fabric_version.split('\\+')[0],
        java_version: java_version
    ])
    filesMatching('fabric.mod.json') {
        expand([
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_description: mod_description,
            mod_author: mod_author,
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_short_version: fabric_version.split('\\+')[0],
            java_version: java_version
        ])
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_ListenerClient" }
    }
}
